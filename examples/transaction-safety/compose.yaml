services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: averact_demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: averact_demo
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U averact_demo -d averact_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
