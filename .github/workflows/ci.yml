name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Run synthetic example
        run: npm run example

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: averact_demo
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: averact_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U averact_demo -d averact_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: averact_demo
      PGPASSWORD: local_demo_only
      PGDATABASE: averact_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: PostgreSQL end-to-end demo
        run: npm run example:postgres
